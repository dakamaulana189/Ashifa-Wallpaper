<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f2dcc5" />
  <title>Ashifa — Live Wallpaper</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <main class="wallpaper" aria-label="Ashifa live wallpaper">
    <div class="clock-panel" aria-live="off">
      <time id="clock" class="clock" aria-label="Jam sekarang">00:00</time>
      <time id="date" class="date" aria-label="Tanggal hari ini">Memuat tanggal...</time>
    </div>
  </main>


  <script src="script.js"></script>
</body>

</html>
